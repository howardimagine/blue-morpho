<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLUE MORPHO · 已退訂</title>
  <meta name="theme-color" content="#02020A">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
  <style>
    .uns-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center;
                text-align: center; padding: 24px; }
    .uns-card { max-width: 460px; }
    .uns-icon { width: 64px; height: 64px; border-radius: 50%;
                border: 2px solid #8a9bb0; color: #8a9bb0;
                display: inline-flex; align-items: center; justify-content: center; font-size: 30px; }
    .uns-title { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 700;
                 letter-spacing: .04em; color: var(--text-primary); margin: 22px 0 10px; }
    .uns-msg { color: var(--text-primary); font-size: 0.95rem; line-height: 1.8; }
    .uns-sub { color: #9fb2c6; font-size: 0.85rem; line-height: 1.7; margin-top: 10px; }
    .uns-cta { display: inline-block; margin-top: 26px; padding: 14px 30px;
               background: var(--accent); color: var(--bg); font-family: var(--font-mono);
               font-weight: 700; letter-spacing: .04em; text-decoration: none; border-radius: 6px;
               box-shadow: 0 0 12px rgba(0,243,255,0.4); }
    .uns-brand { margin-top: 30px; font-family: var(--font-mono); font-size: 0.7rem;
                 letter-spacing: .2em; color: #5b6b80; }
  </style>
</head>
<body>
  <div class="uns-wrap">
    <div class="uns-card">
      <div class="uns-icon">✓</div>
      <div class="uns-title">已成功退訂</div>
      <div class="uns-msg">你不會再收到 Blue Morpho 週報。</div>
      <div class="uns-sub">改變心意了嗎?隨時都可以重新訂閱,<br>我們會把你加回名單。</div>
      <a class="uns-cta" href="/#subscribe">重新訂閱 →</a>
      <div class="uns-brand">BLUE&nbsp;MORPHO</div>
    </div>
  </div>
</body>
</html>
