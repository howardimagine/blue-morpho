<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLUE MORPHO · 本週週報</title>
  <meta name="description" content="Blue Morpho 每週美股精選週報 — 引擎選股、Bloomberg 風分析、賣出訊號與政策觀察。">
  <meta property="og:title" content="BLUE MORPHO · 本週週報">
  <meta property="og:type" content="article">

  <link rel="stylesheet" href="style.css">
  <style>
    .weekly-bar { border-bottom: 1px solid var(--border); padding: var(--space-6) 0; }
    .weekly-bar-row { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .weekly-bar-title { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.18em; color: var(--accent); text-transform: uppercase; }
    .weekly-theme { font-size: clamp(1.1rem, 3vw, 1.6rem); font-weight: 700; color: var(--text-primary); margin-top: var(--space-2); line-height: 1.3; }
    #weekly-switcher { margin-left: auto; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: .05em; padding: 7px 10px; border-radius: 2px; outline: none; cursor: pointer; max-width: 280px; }
    .weekly-frame-wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-12); }
    #weekly-frame { width: 100%; border: 0; background: transparent; display: block; min-height: 70vh; }
    .weekly-loading { font-family: var(--font-mono); font-size: .75rem; color: var(--text-dim); padding: var(--space-10) var(--space-4); text-align: center; letter-spacing: .08em; }
    @media (max-width: 640px) {
      #weekly-switcher { margin-left: 0; width: 100%; }
      .weekly-frame-wrap { padding: var(--space-4) var(--space-2) var(--space-10); }
    }
  </style>
</head>
<body>

<!-- ── Navigation ── -->
<nav class="nav">
  <div class="container">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img class="nav-logo-icon" src="assets/icon.svg" alt="Blue Morpho">
        <div>
          <div class="nav-logo-text">BLUE MORPHO</div>
          <div class="nav-logo-sub">美股前沿觀察</div>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="weekly.html" class="active">WEEKLY</a></li>
        <li><a href="stocks.html">STOCKS</a></li>
      </ul>
      <a href="index.html#subscribe" class="nav-cta">訂閱週報</a>
    </div>
  </div>
</nav>

<main>
  <!-- ── 標頭(主題 / regime / 日期 / 期數下拉)── -->
  <div class="weekly-bar">
    <div class="container">
      <div class="weekly-bar-row">
        <span class="weekly-bar-title">▎ BLUE MORPHO · 週報</span>
        <span id="regime-masthead"></span>
        <span class="mono-xs text-dim" id="weekly-date">—</span>
        <select id="weekly-switcher" aria-label="切換期數"></select>
      </div>
      <div class="weekly-theme" id="weekly-theme">—</div>
    </div>
  </div>

  <!-- ── 完整週報(與 email 同一份 HTML,iframe 隔離 CSS)── -->
  <div class="weekly-frame-wrap">
    <div id="weekly-loading" class="weekly-loading">載入完整週報…</div>
    <iframe id="weekly-frame" title="Blue Morpho 週報" loading="eager"></iframe>
  </div>
</main>

<!-- ── Footer ── -->
<footer class="footer">
  <div class="container">
    <div class="footer-follow" style="text-align:center;padding-bottom:var(--space-6);border-bottom:1px solid var(--border);margin-bottom:var(--space-6);">
      <div style="font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.18em;color:var(--text-dim);text-transform:uppercase;margin-bottom:var(--space-4);">關注 · FOLLOW</div>
      <a href="https://lin.ee/xt0mgJH" target="_blank" rel="noopener" style="display:inline-block;margin:4px 6px;padding:10px 18px;background:#06120e;color:var(--positive);border:1px solid var(--positive);font-family:var(--font-mono);font-size:0.72rem;font-weight:700;letter-spacing:0.04em;text-decoration:none;border-radius:3px;">LINE 即時推播 →</a>
      <a href="index.html#subscribe" style="display:inline-block;margin:4px 6px;padding:10px 18px;background:var(--accent);color:var(--bg);font-family:var(--font-mono);font-size:0.72rem;font-weight:700;letter-spacing:0.04em;text-decoration:none;border-radius:3px;">訂閱週報 →</a>
      <a href="mailto:hello@bluemorpho.art" style="display:inline-block;margin:4px 6px;padding:10px 18px;background:transparent;color:var(--text-secondary);border:1px solid var(--border);font-family:var(--font-mono);font-size:0.72rem;font-weight:700;letter-spacing:0.04em;text-decoration:none;border-radius:3px;">✉ 聯絡作者 hello@bluemorpho.art</a>
    </div>
    <div class="footer-inner">
      <div class="footer-copy">© 2026 BLUE MORPHO · 本站僅供資訊參考，非投資建議</div>
      <div class="footer-links">
        <a href="index.html">首頁</a>
        <a href="#">關於引擎</a>
        <a href="index.html#subscribe">訂閱</a>
      </div>
    </div>
  </div>
</footer>

<script>
const regimeConfig = {
  'risk-on':  { label: 'RISK-ON',  cls: 'regime-risk-on'  },
  'neutral':  { label: 'NEUTRAL',  cls: 'regime-neutral'  },
  'risk-off': { label: 'RISK-OFF', cls: 'regime-risk-off' }
};
function regimeBadge(r) {
  const c = regimeConfig[r] || regimeConfig.neutral;
  return `<span class="regime-badge ${c.cls}">${c.label}</span>`;
}

(async function init() {
  // 期數清單
  let idx = [];
  try { idx = await (await fetch('/data/weekly/index.json')).json(); } catch {}
  const qs = new URLSearchParams(location.search);
  const latest = idx.length ? idx[0].date : null;
  const want = qs.get('d');
  const useDate = (want && idx.some(w => w.date === want)) ? want : latest;

  // 下拉
  const sw = document.getElementById('weekly-switcher');
  if (sw && idx.length) {
    sw.innerHTML = idx.map(w =>
      `<option value="${w.date}"${w.date === useDate ? ' selected' : ''}>${w.date} · ${w.headline || w.theme}</option>`).join('');
    sw.addEventListener('change', () => { location.href = 'weekly.html?d=' + sw.value; });
  } else if (sw) { sw.style.display = 'none'; }

  // 標頭資料(主題 / 日期 / regime)
  try {
    const src = (!useDate || useDate === latest) ? '/data/report_cards.json' : `/data/weekly/${useDate}.json`;
    const d = await (await fetch(src)).json();
    document.getElementById('weekly-theme').textContent = d.headline || d.theme || '—';
    document.getElementById('weekly-date').textContent = d.date || '';
    const rb = document.getElementById('regime-masthead');
    if (rb) rb.innerHTML = regimeBadge(d.regime);
    document.title = `BLUE MORPHO · 週報 · ${d.date || ''}`;
  } catch {}

  // iframe 載入完整 email 報告(同一份 HTML)
  const frame = document.getElementById('weekly-frame');
  const loading = document.getElementById('weekly-loading');
  if (!useDate) { loading.textContent = '尚無週報'; frame.style.display = 'none'; return; }
  frame.src = `/data/weekly/${useDate}.html`;
  frame.addEventListener('load', () => {
    loading.style.display = 'none';
    try {
      const doc = frame.contentWindow.document;
      const resize = () => { frame.style.height = doc.body.scrollHeight + 'px'; };
      resize(); setTimeout(resize, 300); setTimeout(resize, 1200);
      doc.querySelectorAll('img').forEach(img => { if (!img.complete) img.addEventListener('load', resize); });
      window.addEventListener('resize', resize);
    } catch (e) { frame.style.height = '4000px'; }
  });
  frame.addEventListener('error', () => { loading.textContent = '載入失敗'; });
})();
</script>

  <a href="index.html">HOME</a>
  <a href="weekly.html" class="active">WEEKLY</a>
  <a href="stocks.html">STOCKS</a>
</nav>
</body>
</html>
