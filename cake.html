function squarify(items,W,H){ // items:[{v,...}] 已依 v 降序;回傳加上 x,y,w,h
  const out=[];let x=0,y=0,w=W,h=H,tot=items.reduce((a,b)=>a+b.v,0),i=0;

    for(let j=i;j<items.length;j++){const s2=sum+items[j].v,len=s2/tot*(vert?h:w);const worst=Math.max(...row.concat(items[j]).map(it=>{const a=it.v/s2*side;return Math.max(len/a,a/len)}));if(worst>best){break}row.push(items[j]);sum=s2;best=worst}

const itiles=x.industries.map(i=>({...i,v:i.mc,title:`${i.ind} · ${i.n} 檔 · ${i.top.join(' ')}`}));
app.innerHTML=`<div class="eyebrow"><a href="#/market">全市場</a> · 第 ${M.sectors.indexOf(x)+1} 名 · ${x.group}類 · ${sigc(x.signal)}</div><h1>${x.zh}${ind?' · '+esc(ind):''}</h1>
<div class="kpis"><div class="kpi"><b>${x.score}</b><span>Score</span></div><div class="kpi"><b>${pct(x.w1)}</b><span>當週</span></div><div class="kpi"><b>${pct(x.w4)}</b><span>4 週</span></div><div class="kpi"><b>${fmt$(x.f1)}</b><span>當週資金流(${x.src==='etf'?x.etf+' 申贖':'代理'})</span></div><div class="kpi"><b>${fmt$(x.f4)}</b><span>4 週資金流</span></div><div class="kpi"><b>${Math.round(x.breadth50*100)}%</b><span>站上 MA50</span></div><div class="kpi"><b>${x.rsi.toFixed(0)}</b><span>RSI(中位)</span></div><div class="kpi"><b>${x.adv} / ${x.dec}</b><span>今日漲 / 跌</span></div></div>
<h2>板塊內各產業</h2><p class="sub">面積 = 產業總市值,顏色 = ${HZL[k==='d1'?'w1':k]}報酬。點產業只看它的成分股;再點一次板塊名回到全部。</p>${seg(k,['d1','w1','w4'])}
${heat(itiles,k==='d1'?'w1':k,340,t=>'#/sector/'+encodeURIComponent(sec)+(ind===t.ind?'':'/'+encodeURIComponent(t.ind)),t=>`<b>${esc(t.ind)}</b><span class="p">${pct(t[k==='d1'?'w1':k])}</span><small>${t.n} 檔 · ${fmt$(k==='w4'?t.f4:t.f1)}</small>`)}
<h2>個股熱力圖${cur?` · ${esc(ind)}(${cur.n} 檔)`:`(${ss.length} 檔)`}</h2><p class="sub">面積 = 市值,顏色 = ${HZL[k]}報酬。點個股看供應鏈雷達的判定(只有七層內的個股有完整三道門資料)。</p>
${heat(ss,k,Math.min(900,300+ss.length*3),t=>'#/stock/'+t.s,t=>`<b>${t.s}</b><span class="p">${pct(t[k])}</span>`)}
<div class="tbl" style="margin-top:14px"><table><tr><th>代號</th><th>產業</th><th>市值</th><th>價</th><th>今日</th><th>當週</th><th>4 週</th><th>RSI</th><th>MA50</th><th>4 週流</th></tr>
${ss.sort((a,b)=>b.mc-a.mc).slice(0,60).map(r=>`<tr><td><a href="#/stock/${r.s}">${r.s}</a></td><td>${esc(r.ind)}</td><td>${fmt$(r.mc).slice(2)}</td><td>${r.px}</td><td>${pct(r.d1)}</td><td>${pct(r.w1)}</td><td>${pct(r.w4)}</td><td>${r.rsi==null?'—':r.rsi.toFixed(0)}</td><td>${r.above50?'<span class="ok">上</span>':'<span class="no">下</span>'}</td><td class="${r.f4>=0?'ok':'no'}">${fmt$(r.f4)}</td></tr>`).join('')}</table></div>
${ss.length>60?`<p class="sub" style="font-size:12px">表只列市值前 60 檔;熱力圖是全部。</p>`:''}`;bindSeg()}
function method(){app.innerHTML=`<div class="eyebrow">方法</div><h1>這裡的 SEPA 和原版差在哪</h1>
<p>SEPA 是 Minervini 的 Specific Entry Point Analysis:趨勢模板篩股、基本面加速、相對強弱、VCP 收縮後突破買進。你的「SEPA 雷達」是原版的全市場掃描。這個產品把它降職成「層內的進場計時器」,差別如下。</p>
<div class="tbl"><table><tr><th>篩</th><th>原版 SEPA 雷達(exec)</th><th>供應鏈雷達(層內版)</th><th>為什麼</th></tr><tr><td>宇宙</td><td>全美股 ~2,800 檔</td><td>七層 AI 供應鏈 ~45 檔 + 追蹤名單</td><td>先有「錢流到哪一層」的假設,再找股</td></tr><tr><td>趨勢模板</td><td>8 條</td><td>7 條不放寬 + RS 改層內</td><td>防線,放寬會買到下跌趨勢</td></tr><tr><td>基本面</td><td>EPS 且營收加速</td><td>用評級機動能百分位前 1/3 代替</td><td>供應鏈中段常是營收先動</td></tr><tr><td>相對強弱</td><td>全市場 RS ≥ 70</td><td>層內 63 日報酬前 40%</td><td>層已經是你選的</td></tr><tr><td>進場型態</td><td>只有 VCP 突破</td><td>甲 VCP 突破 / 乙 回測承接 / 丙 停損回場</td><td>原版觸發太少</td></tr><tr><td>出場</td><td>無</td><td>型態停損、MA200×0.97、評級降級、層跌出前三、論點證偽</td><td>原版最缺的</td></tr></table></div>
<h2>三道門是什麼</h2><ol class="steps"><li><b>論點門(人填)</b>:屬於順風層,且說得出這家在該層的份額未來兩年增加。</li><li><b>價格門(機器)</b>:趨勢模板 + 層內 RS + 評級 + 三型態之一。全過才會綠底、才會發 LINE。</li><li><b>資金門(紀律)</b>:每次只投可投入資金的 1/4,同檔一季最多兩次,單檔上限 8%。</li></ol>
<h2>為什麼現在是觀察模式</h2><p>回測(2017–2026,今日成分股,有存活者偏誤)顯示:乙型回測承接的 60 日中位只比買進持有多 0.5 點,平均 R +0.5、勝率 50%;只用價格面算的層順風,在順風層與非順風層的 R 幾乎一樣。承載論點的資料(營收預估上修、資本支出指引)2026-10 才開始每週存快照,要累積 90 天以上才能驗證層選擇有沒有用。解除條件:快照滿 90 天重測通過,且線上觸發累積 30 筆、勝率 ≥ 50%。</p>
<h2>個股評分怎麼算</h2><p>層內相對強弱(63 日報酬在層內的名次)40% + 評級機動能百分位 40% + 趨勢模板通過比例 20%。它只用來排序,讓你一眼看到每層最強的是誰;不是進場訊號。</p>
<h2>怎麼追蹤特定公司</h2><p>例如 PLTR 已在「雲與軟體」層。把它加進 watch 名單後:個股頁永遠可查;型態一出現就 LINE 通知,即使層不順風(會標「門未全過」);判定欄會寫明還差哪一關、差多少。不在七層裡的公司,要同時加進某一層的 syms 才算得出層內相對強弱。</p>`;crumb.textContent='方法'}
const dl=document.getElementById('syms');dl.innerHTML=D.rows.map(r=>`<option value="${r.s}">${r.layer} · 評分 ${r.score}</option>`).join('')+D.layers.table.map(x=>`<option value="${x.layer}">層</option>`).join('');
document.getElementById('sf').onsubmit=e=>{e.preventDefault();const v=document.getElementById('q').value.trim();if(!v)return;const L=D.layers.table.find(x=>x.layer===v);location.hash=L?'#/layer/'+encodeURIComponent(v):'#/stock/'+v.toUpperCase();document.getElementById('q').value=''};
loadRemote().then(()=>{if((location.hash||'#/').startsWith('#/watch'))route()});
function route(){const h=location.hash||'#/',p=h.slice(2).split('/');document.querySelectorAll('.top a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')===h||(h==='#/'&&a.id==='n-home')));
if(p[0]==='market')market();else if(p[0]==='sector')sector(decodeURIComponent(p[1]||''),p[2]?decodeURIComponent(p[2]):null);else if(p[0]==='layer')layer(decodeURIComponent(p[1]||''));else if(p[0]==='stock')stock(decodeURIComponent(p[1]||'').toUpperCase());else if(p[0]==='watch')watch();else if(p[0]==='method')method();else home();window.scrollTo(0,0)}
addEventListener('hashchange',route);route()})();
