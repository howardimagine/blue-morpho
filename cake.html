function watchUI(sym){const on=(REMOTE||D.watch).includes(sym);return `<div class="keyrow"><button class="btn ${on?'on':''}" id="wbtn" data-sym="${sym}" data-on="${on?1:0}">${on?'追蹤中 · 點一下取消':'加入追蹤'}</button>${getKey()?'':'<input id="wkey" type="password" placeholder="鑰匙 CAKE_WATCH_KEY(只需一次)">'}<span class="msg" id="wmsg">${on?'型態一出現就 LINE 通知,即使層不順風。':'加入後:個股頁常駐、型態一出現就 LINE 通知。明早 06:30 重算後生效。'}</span></div>`}
function bindWatch(){const b=document.getElementById('wbtn');if(!b)return;b.onclick=async()=>{const key=getKey()||(document.getElementById('wkey')||{}).value||'';if(!key){document.getElementById('wmsg').textContent='請先輸入鑰匙(.env 的 CAKE_WATCH_KEY)';return}const err=await setWatch(b.dataset.sym,b.dataset.on==='1'?'remove':'add',key,b);document.getElementById('wmsg').textContent=err||'已更新,明早重算後名單生效';if(!err){b.dataset.on=b.dataset.on==='1'?'0':'1';b.classList.toggle('on');b.textContent=b.dataset.on==='1'?'追蹤中 · 點一下取消':'加入追蹤'}}}

const vpill=r=>`<span class="pill ${r.verdict.level}">${r.verdict.head.split(':')[0].split(',')[0]}</span>`;

${D.bt?`<h2>回測摘要</h2><p class="sub">${esc(D.bt.note)}</p><div class="tbl"><table><tr><th>型態</th><th>次數</th><th>每月</th><th>勝率</th><th>平均 R</th><th>中位 60 日</th><th>順風層 R</th><th>非順風 R</th></tr>${Object.entries(D.bt.patterns).map(([k,v])=>`<tr><td>${k} ${KT[k]||''}</td><td>${v.n}</td><td>${v.per_month.toFixed(1)}</td><td>${Math.round(v.win*100)}%</td><td>${v.avg_r>=0?'+':''}${v.avg_r.toFixed(2)}</td><td>${pct(v.med60)}</td><td>${v.tw_r==null?'—':v.tw_r.toFixed(2)}</td><td>${v.ntw_r==null?'—':v.ntw_r.toFixed(2)}</td></tr>`).join('')}</table></div><p class="sub">同批股票任意日持有 60 日中位 ${pct(D.bt.hold60_median)}。H2(平均 R ≥ 1.2)與 H3(順風層 R 明顯高於非順風)未過,所以是觀察模式。</p>`:''}`;crumb.textContent=''}

app.innerHTML=`<div class="eyebrow">第 ${x.layer_rank||D.layers.table.indexOf(x)+1} 名 · ${x.tailwind?'順風':'非順風'} · ${x.lag_q?'落後 +'+x.lag_q+' 季':'同季'}</div><h1>${n}</h1>
<div class="kpis"><div class="kpi"><b>${Math.round(x.score)}</b><span>層評分</span></div><div class="kpi"><b>${pct(x.rs63)}</b><span>相對 SPY 63 日</span></div><div class="kpi"><b>${Math.round(x.breadth50*100)}%</b><span>站上 MA50</span></div><div class="kpi"><b>${x.rev_up==null?'—':Math.round(x.rev_up*100)+'%'}</b><span>營收預估上修比例</span></div></div>

function stock(s){const r=D.rows.find(x=>x.s===s);if(!r){if(!/^[A-Z][A-Z0-9.-]{0,9}$/.test(s)){app.innerHTML='<p>代號格式不對。</p>';return}app.innerHTML=`<div class="eyebrow">不在今天的資料裡</div><h1>${s}</h1><p class="sub">${s} 不在七層成分股,今天沒有算。加入追蹤後,明早 06:30 的掃描會把它算進來:趨勢模板逐條、相對強弱(與全部追蹤股比)、評級、三型態、判定。它不屬於任何一層,所以沒有「層順風」這道門;要納入某一層,告訴 Claude 改 layers.json。</p>${watchUI(s)}`;bindWatch();crumb.textContent=s;return}const d=r.detail,v=r.verdict,x=Lrow(r.layer);
app.innerHTML=`<div class="eyebrow"><a href="#/layer/${encodeURIComponent(r.layer)}">${r.layer}</a> · 層第 ${r.layer_rank} 名${x.tailwind?' · 順風':''}${r.watch?' · 追蹤名單':''}</div><h1>${r.s} <span style="font:400 18px var(--mono);color:var(--ink2)">${r.px}</span></h1>

<div class="grid2"><div class="box"><h3 style="margin-top:0">距離</h3><div class="chk"><span>距 MA21</span><span>${f1(d.d21)}</span><span></span><span>距 MA50</span><span>${f1(d.d50)}</span><span></span><span>距 MA200</span><span>${f1(d.d200)}</span><span></span><span>距規則出場線 MA200×0.97</span><span>${f1(d.dexit)}</span><span></span><span>距 52 週高</span><span>${f1(d.dhi)}</span><span></span><span>20 日相對 QQQ</span><span>${f1(d.rel20)}</span><span></span><span>連續站上 MA50</span><span>${d.days_above50} 天</span><span></span></div></div>

function watch(){const ws=D.rows.filter(r=>r.watch),remote=REMOTE||D.watch,pending=remote.filter(s=>!D.rows.some(r=>r.s===s));app.innerHTML=`<div class="eyebrow">追蹤名單</div><h1>你點名要追的公司</h1><p class="sub">在任何個股頁按「加入追蹤」,或用上方搜尋輸入代號。追蹤中的股票:個股頁常駐、型態一出現就 LINE 通知,即使層不順風(會標「門未全過」)。不在七層裡的公司會列在「未分層」,沒有層順風這道門。</p>${pending.length?`<p class="sub">已加入、等明早 06:30 計算:${pending.map(s=>`<a href="#/stock/${s}">${s}</a>`).join('、')}</p>`:''}${ws.length?stockTable(ws,true):'<p class="sub">目前沒有已計算的追蹤股。</p>'}`;crumb.textContent='追蹤'}
function method(){app.innerHTML=`<div class="eyebrow">方法</div><h1>這裡的 SEPA 和原版差在哪</h1>
<p>SEPA 是 Minervini 的 Specific Entry Point Analysis:趨勢模板篩股、基本面加速、相對強弱、VCP 收縮後突破買進。你的「SEPA 雷達」是原版的全市場掃描。這個產品把它降職成「層內的進場計時器」,差別如下。</p>
<div class="tbl"><table><tr><th>篩</th><th>原版 SEPA 雷達(exec)</th><th>供應鏈雷達(層內版)</th><th>為什麼</th></tr><tr><td>宇宙</td><td>全美股 ~2,800 檔</td><td>七層 AI 供應鏈 ~45 檔 + 追蹤名單</td><td>先有「錢流到哪一層」的假設,再找股</td></tr><tr><td>趨勢模板</td><td>8 條</td><td>7 條不放寬 + RS 改層內</td><td>防線,放寬會買到下跌趨勢</td></tr><tr><td>基本面</td><td>EPS 且營收加速</td><td>用評級機動能百分位前 1/3 代替</td><td>供應鏈中段常是營收先動</td></tr><tr><td>相對強弱</td><td>全市場 RS ≥ 70</td><td>層內 63 日報酬前 40%</td><td>層已經是你選的</td></tr><tr><td>進場型態</td><td>只有 VCP 突破</td><td>甲 VCP 突破 / 乙 回測承接 / 丙 停損回場</td><td>原版觸發太少</td></tr><tr><td>出場</td><td>無</td><td>型態停損、MA200×0.97、評級降級、層跌出前三、論點證偽</td><td>原版最缺的</td></tr></table></div>
<h2>三道門是什麼</h2><ol class="steps"><li><b>論點門(人填)</b>:屬於順風層,且說得出這家在該層的份額未來兩年增加。</li><li><b>價格門(機器)</b>:趨勢模板 + 層內 RS + 評級 + 三型態之一。全過才會綠底、才會發 LINE。</li><li><b>資金門(紀律)</b>:每次只投可投入資金的 1/4,同檔一季最多兩次,單檔上限 8%。</li></ol>
<h2>為什麼現在是觀察模式</h2><p>回測(2017–2026,今日成分股,有存活者偏誤)顯示:乙型回測承接的 60 日中位只比買進持有多 0.5 點,平均 R +0.5、勝率 50%;只用價格面算的層順風,在順風層與非順風層的 R 幾乎一樣。承載論點的資料(營收預估上修、資本支出指引)2026-10 才開始每週存快照,要累積 90 天以上才能驗證層選擇有沒有用。解除條件:快照滿 90 天重測通過,且線上觸發累積 30 筆、勝率 ≥ 50%。</p>
<h2>個股評分怎麼算</h2><p>層內相對強弱(63 日報酬在層內的名次)40% + 評級機動能百分位 40% + 趨勢模板通過比例 20%。它只用來排序,讓你一眼看到每層最強的是誰;不是進場訊號。</p>
<h2>怎麼追蹤特定公司</h2><p>例如 PLTR 已在「雲與軟體」層。把它加進 watch 名單後:個股頁永遠可查;型態一出現就 LINE 通知,即使層不順風(會標「門未全過」);判定欄會寫明還差哪一關、差多少。不在七層裡的公司,要同時加進某一層的 syms 才算得出層內相對強弱。</p>`;crumb.textContent='方法'}
