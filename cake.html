function squarify(items,W,H){ // items:[{v,...}] 已依 v 降序;回傳加上 x,y,w,h
  const out=[];let x=0,y=0,w=W,h=H,tot=items.reduce((a,b)=>a+b.v,0),i=0;
  while(i<items.length){const vert=w<h,side=vert?w:h;let row=[],sum=0,best=Infinity;
    for(let j=i;j<items.length;j++){const s2=sum+items[j].v,len=s2/tot*(vert?h:w);const worst=Math.max(...row.concat(items[j]).map(it=>{const a=it.v/s2*side;return Math.max(len/a,a/len)}));if(worst>best){break}row.push(items[j]);sum=s2;best=worst}
    const len=sum/tot*(vert?h:w);let off=0;for(const it of row){const a=it.v/sum*side;if(vert){Object.assign(it,{x:x+off,y,w:a,h:len})}else{Object.assign(it,{x,y:y+off,w:len,h:a})}off+=a;out.push(it)}

  return out}
