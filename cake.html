async function setWatch(sym,action,key,el){el.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sym,action,key})});const j=await r.json();if(!r.ok){el.disabled=false;return j.error==='forbidden'?'鑰匙不對':('失敗:'+(j.error||r.status))}REMOTE=j.watch;try{localStorage.setItem('cake.key',key)}catch(e){}el.disabled=false;return ''}catch(e){el.disabled=false;return '連線失敗'}}
